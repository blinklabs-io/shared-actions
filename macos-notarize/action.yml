name: Notarize macOS artifact
description: Submit a signed macOS package or ZIP and verify the notarization result.
inputs:
  artifact:
    description: Path to the signed package or ZIP to notarize.
    required: true
  profile:
    description: Keychain profile containing notarization credentials.
    required: true
  keychain:
    description: Temporary keychain containing the profile.
    required: true
  format:
    description: Artifact format, pkg or zip.
    required: true
runs:
  using: composite
  steps:
    - name: Notarize and verify
      shell: bash
      env:
        MACOS_NOTARIZE_ARTIFACT: ${{ inputs.artifact }}
        MACOS_NOTARIZE_PROFILE: ${{ inputs.profile }}
        MACOS_NOTARIZE_KEYCHAIN: ${{ inputs.keychain }}
        MACOS_NOTARIZE_FORMAT: ${{ inputs.format }}
      run: 'bash "$GITHUB_ACTION_PATH/notarize.sh"'
