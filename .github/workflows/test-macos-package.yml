name: Test macOS package assembly

on:
  pull_request:
    paths:
      - 'macos-package/**'
      - 'macos-release/**'
      - 'tests/macos_build_test.*'
      - 'tests/macos_package_*'
      - 'tests/macos_release_test.*'
      - '.github/workflows/test-macos-package.yml'
  push:
    branches: [main]
    paths:
      - 'macos-package/**'
      - 'macos-release/**'
      - 'tests/macos_build_test.*'
      - 'tests/macos_package_*'
      - 'tests/macos_release_test.*'
      - '.github/workflows/test-macos-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Create fixture source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .macos-fixture/cmd/fixture
          printf 'module example.com/fixture\n\ngo 1.26\n' > .macos-fixture/go.mod
          printf 'package main\nfunc main() {}\n' > .macos-fixture/cmd/fixture/main.go
      - name: Build fixture binary
        id: build
        uses: $/macos-package/build
        with:
          config: '{"binaries":[{"name":"fixture","module":".macos-fixture","package":"./cmd/fixture","cgo":false,"tags":[]}]}'
          output: .macos-fixture/built
          version: '1.2.3'
          architecture: arm64
      - name: Assemble ad-hoc installer
        id: package
        uses: $/macos-package
        with:
          config: '{"metadata":{"application_name":"Fixture","bundle_id":"io.blinklabs.fixture","executable":"fixture","icon_name":"fixture","version":"1.2.3","architecture":"arm64","binary_names":["fixture"]},"binaries":{"fixture":".macos-fixture/built/fixture"},"icon":".macos-fixture/missing.icns"}'
          output: .macos-fixture/fixture.pkg
          mode: adhoc
      - name: Inspect installer and app signature
        shell: bash
        env:
          PKG_PATH: ${{ steps.package.outputs.package }}
        run: |
          set -euo pipefail
          pkgutil --expand-full "$PKG_PATH" "$RUNNER_TEMP/expanded-macos-fixture"
          app="$RUNNER_TEMP/expanded-macos-fixture/component.pkg/Payload/Applications/Fixture.app"
          test -x "$app/Contents/MacOS/fixture"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/fixture" | grep -w arm64
          plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist" | grep -x io.blinklabs.fixture
      - name: Exercise the common release path
        id: common-release
        uses: $/macos-release
        with:
          config: '{"artifact_type":"pkg","artifact_basename":"fixture","build":{"binaries":[{"name":"fixture","module":".macos-fixture","package":"./cmd/fixture","cgo":false,"tags":[]}]},"metadata":{"application_name":"Fixture","bundle_id":"io.blinklabs.fixture","executable":"fixture","icon_name":"fixture"},"icon":".macos-fixture/missing.icns"}'
          architecture: arm64
          version: '1.2.3'
          mode: adhoc
      - name: Inspect common release artifact
        shell: bash
        env:
          PKG_PATH: ${{ steps.common-release.outputs.artifact }}
        run: |
          set -euo pipefail
          test -f "$PKG_PATH"
          pkgutil --expand-full "$PKG_PATH" "$RUNNER_TEMP/expanded-common-release"
          app="$RUNNER_TEMP/expanded-common-release/component.pkg/Payload/Applications/Fixture.app"
          test -x "$app/Contents/MacOS/fixture"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/fixture" | grep -w arm64
