name: Validate shared workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Python checks
        run: python -m pip install -r requirements-python-checks.txt
      - name: Check Python formatting, lint and types
        run: |
          ruff format --check macos-package macos-release macos-signing-setup tests
          ruff check macos-package macos-release macos-signing-setup tests
          mypy macos-package/*.py macos-release/*.py macos-signing-setup/*.py
      - name: Check formatting
        run: test -z "$(gofmt -l tests)"
      - name: Test
        run: go test -race ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
